services:
  - type: web
    name: mlflow-fastapi
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app -b 0.0.0.0:$PORT
    envVars:
      - key: MODEL_URI
        value: "models:/MyModel/Production"
